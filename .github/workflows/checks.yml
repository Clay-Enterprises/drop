name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  typecheck:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  bun-tests:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test test/cli

  worker-integration:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test test/worker

  skill-smoke:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun test test/skills.test.ts

  release-startup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-2vcpu-ubuntu-2404
          - runner: blacksmith-2vcpu-ubuntu-2404-arm
          - runner: blacksmith-6vcpu-macos-15
          - runner: blacksmith-6vcpu-macos-15
            bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-darwin-x64-baseline.zip
          - runner: blacksmith-2vcpu-windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Intel Mac tests through Rosetta
        if: matrix.bun-download-url != ''
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.bun-download-url != '' && 'x64' || '' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
          bun-download-url: ${{ matrix.bun-download-url }}
      - run: bun install --frozen-lockfile
      - run: bun test test/release

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - typecheck
      - bun-tests
      - worker-integration
      - skill-smoke
      - release-startup
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment:
      name: production
      url: https://drop.clay.sh
    concurrency:
      group: drop-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Deploy Worker
        run: bun run deploy

  prepare-cli-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - typecheck
      - bun-tests
      - worker-integration
      - skill-smoke
      - release-startup
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        name: Plan CLI release
        run: |
          base=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)

          if [[ -n "$base" ]] && git diff --quiet "$base" "$GITHUB_SHA" -- \
            src/cli src/shared install.sh install.ps1; then
            echo 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "CLI code changed, but $tag already exists. Bump package.json version." >&2
            exit 1
          fi

          echo 'release=true' >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release-cli:
    needs: prepare-cli-release
    if: needs.prepare-cli-release.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare-cli-release.outputs.tag }}
