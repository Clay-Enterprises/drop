name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            asset: drop-darwin-arm64
            runner: macos-15
          - target: bun-darwin-x64-baseline
            asset: drop-darwin-x64
            runner: macos-15-intel
          - target: bun-linux-arm64
            asset: drop-linux-arm64
            runner: ubuntu-24.04-arm
          - target: bun-linux-x64-baseline
            asset: drop-linux-x64
            runner: ubuntu-latest
          - target: bun-windows-x64-baseline
            asset: drop-windows-x64.exe
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Match the tag to package metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$RELEASE_TAG" = "v$(bun -p 'require("./package.json").version')"
      - name: Build standalone binary
        run: bun run build:release --target=${{ matrix.target }} --outfile=dist/${{ matrix.asset }}
      - name: Start standalone binary
        if: runner.os != 'Windows'
        run: |
          chmod 0755 dist/${{ matrix.asset }}
          ./dist/${{ matrix.asset }} --version
          ./dist/${{ matrix.asset }} --help
      - name: Start standalone binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "./dist/${{ matrix.asset }}" --version
          & "./dist/${{ matrix.asset }}" --help
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Write checksums and add installers
        run: |
          cd dist
          sha256sum drop-* > SHA256SUMS
          cd ..
          cp install.sh install.ps1 dist/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/* --generate-notes --target "$GITHUB_SHA" --title "$RELEASE_TAG"
